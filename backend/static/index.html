  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

        extend: {
          fontFamily: {

    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="flex min-h-screen bg-[#f8fafc] text-slate-900 antialiased overflow-x-hidden">

    <div>

      <!-- Navigation Links -->
      <nav class="p-3 space-y-1 mt-2" id="nav-container">
        <button onclick="switchTab('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all bg-[#2563eb] text-white shadow-md shadow-blue-600/30">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span>Platform Analytics</span>

        <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-white/5">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <!-- Bottom Status & User Profile -->
    <div className="p-4 border-t border-[#1e293b]/60 space-y-4">
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-800">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <div class="flex flex-col">
          <span class="text-xs font-semibold text-slate-200">Connected</span>
          <span class="text-[10px] text-slate-500">Last updated Today, 04:32 PM</span>
        </div>
      </div>

      <div class="flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-white/5 cursor-pointer transition-colors">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-indigo-600 text-white font-semibold text-xs flex items-center justify-center ring-2 ring-indigo-400/30">
            RD
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-semibold text-white">Raghav Dev</span>
            <span class="text-[11px] text-slate-400">Admin</span>
          </div>
        </div>
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>

  <!-- ========================================== -->
  <!-- MAIN WORKSPACE                             -->
  <!-- ========================================== -->
  <div class="flex-1 flex flex-col min-w-0 min-h-screen">
    <!-- Header Bar -->
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-30 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
      <!-- Search Input -->
      <div class="relative w-80 md:w-96">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input
          type="text"
          id="global-search"
          oninput="handleSearch(this.value)"
          placeholder="Search orders, shipments, or tracking IDs..."
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
        />
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3">
        <!-- Date Filter -->
        <select id="date-select" onchange="handleFilterChange()" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          <option value="Last 30 Days">Last 30 Days</option>
          <option value="Last 7 Days">Last 7 Days</option>
          <option value="Last 90 Days">Last 90 Days</option>
        </select>

        <!-- Platform Filter -->
        <select id="platform-select" onchange="handleFilterChange()" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          <option value="All Platforms">All Platforms</option>
          <option value="Amazon">Amazon</option>
          <option value="Flipkart">Flipkart</option>
        </select>

        <!-- Refresh Button -->
        <button onclick="refreshDashboard()" id="refresh-btn" class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors shadow-sm">
          <svg id="refresh-icon" class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Refresh</span>
        </button>

        <!-- Notifications -->
        <button class="relative p-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute top-1.5 right-1.5 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white">3</span>
        </button>
      </div>

    <!-- CONTENT CONTAINERS -->
    <main class="p-6 space-y-5 max-w-[1600px] w-full mx-auto" id="main-content">
      <!-- Injected Dynamically Based on Active Tab -->
    </main>
  </div>

  <!-- APPLICATION SCRIPTS -->
  <script>
    let currentTab = 'overview';
    let currentPlatform = 'All Platforms';
    let currentDateRange = 'Last 30 Days';
    let currentSearch = '';
    let currentState = '';
    let overviewCache = null;

    async function init() {
      await loadOverview();
    }

    function switchTab(tab) {
      currentTab = tab;
      // Update nav styling
      const navItems = ['overview', 'orders', 'shipments', 'revenue', 'geography', 'platforms', 'events', 'data', 'reports', 'settings'];
      navItems.forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (!btn) return;
        if (t === tab) {
          btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all bg-[#2563eb] text-white shadow-md shadow-blue-600/30";
          btn.querySelector('svg').className = "w-4 h-4 text-white";
        } else {
          btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-white/5";
          btn.querySelector('svg').className = "w-4 h-4 text-slate-400";
        }
      });

      if (tab === 'overview') renderOverview();
      else if (tab === 'orders') renderOrders();
      else if (tab === 'shipments') renderShipments();
      else if (tab === 'revenue') renderRevenue();
      else if (tab === 'geography') renderGeography();
      else if (tab === 'platforms') renderPlatforms();
      else if (tab === 'events') renderEvents();
      else if (tab === 'data') renderData();
      else if (tab === 'reports') renderReports();
      else if (tab === 'settings') renderSettings();
    }

    async function loadOverview() {
      const q = new URLSearchParams({
        platform: currentPlatform,
        date_range: currentDateRange,
        search: currentSearch,
        state: currentState
      });
      try {
        const res = await fetch('/api/overview?' + q.toString());
        overviewCache = await res.json();
        if (currentTab === 'overview') renderOverview();
      } catch (err) {
        console.error("Overview fetch error:", err);
      }
    }

    function handleFilterChange() {
      currentPlatform = document.getElementById('platform-select').value;
      currentDateRange = document.getElementById('date-select').value;
      loadOverview();
      if (currentTab === 'orders') renderOrders();
      if (currentTab === 'shipments') renderShipments();
    }

    function handleSearch(val) {
      currentSearch = val;
      loadOverview();
    }

    async function refreshDashboard() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('animate-spin');
      await loadOverview();
      setTimeout(() => icon.classList.remove('animate-spin'), 600);
    }

    function buildSparkline(pts, stroke) {
      if (!pts || pts.length < 2) return '';
      const min = Math.min(...pts);
      const max = Math.max(...pts);
      const range = max - min || 1;
      const w = 80;
      const h = 28;
      const pathD = pts.map((val, i) => {
        const x = (i / (pts.length - 1)) * w;
        const y = h - ((val - min) / range) * (h - 6) - 3;
        return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-20 h-7 overflow-visible">
          <path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
    }

    function renderKpiCard(m) {
      const colorMap = {
        blue: { bg: 'bg-blue-50', text: 'text-blue-600', stroke: '#2563eb' },
        green: { bg: 'bg-emerald-50', text: 'text-emerald-600', stroke: '#16a34a' },
        orange: { bg: 'bg-amber-50', text: 'text-amber-600', stroke: '#ea580c' },
        red: { bg: 'bg-rose-50', text: 'text-rose-600', stroke: '#dc2626' },
        navy: { bg: 'bg-slate-100', text: 'text-slate-600', stroke: '#475569' },
        cyan: { bg: 'bg-cyan-50', text: 'text-cyan-600', stroke: '#0891b2' },
        purple: { bg: 'bg-violet-50', text: 'text-violet-600', stroke: '#7c3aed' }
      };
      const c = colorMap[m.color] || colorMap.blue;
      const isUp = m.trend === 'up';

      return `
        <div class="bg-white rounded-xl border border-slate-200/80 p-4 flex flex-col justify-between shadow-[0_1px_3px_rgba(0,0,0,0.04)] hover:shadow-md transition-shadow">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg ${c.bg} ${c.text} flex items-center justify-center shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            </div>
            <span class="text-xs font-medium text-slate-500 leading-tight">${m.title}</span>
          </div>

          <div class="my-2.5">
            <span class="text-2xl font-bold text-slate-900 tracking-tight">${m.value}</span>
          </div>

          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-1 text-xs font-semibold ${isUp ? 'text-emerald-600' : 'text-rose-600'}">
              <span>${m.change}</span>
            </div>
            <div>
              ${buildSparkline(m.sparkline, c.stroke)}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 1. EXECUTIVE OVERVIEW (Reference Image Spec)
    // ==========================================
    function renderOverview() {
      if (!overviewCache) return;
      const d = overviewCache;
      const k = d.kpis;

      const container = document.getElementById('main-content');
      container.innerHTML = `
        <!-- Title & Live Badge -->
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Executive Overview</h1>
            <p class="text-xs text-slate-500 mt-0.5">Real-time business performance and logistics intelligence</p>
          </div>

          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-xs font-semibold shadow-sm">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <svg class="w-3.5 h-3.5 text-emerald-600 fill-emerald-600" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span>Live • Data Updated: ${d.data_updated}</span>
          </div>
        </div>

        <!-- Row 1: 5 KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
          ${renderKpiCard(k.total_purchases)}
          ${renderKpiCard(k.total_orders)}
          ${renderKpiCard(k.accepted_orders)}
          ${renderKpiCard(k.processing_orders)}
          ${renderKpiCard(k.shipped_orders)}
        </div>

        <!-- Row 2: 5 KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
          ${renderKpiCard(k.delivered_orders)}
          ${renderKpiCard(k.cancelled_orders)}
          ${renderKpiCard(k.returned_orders)}
          ${renderKpiCard(k.total_revenue)}
          ${renderKpiCard(k.total_profit)}
        </div>

        <!-- Row 3: 2 Left Cards + Wide Revenue & Profit Trend Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <div class="lg:col-span-4 flex flex-col gap-4">
            ${renderKpiCard(k.delivery_success_rate)}

    async function updateOrderStatusLive(orderId, newStatus) {
      try {
        await fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        await loadOverview();
      } catch (e) {
        alert(e.message);
      }
    }

    async function handleManualUpload() {
      const fileInput = document.getElementById('dataset-file-input');
      const statusDiv = document.getElementById('upload-status');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Please choose a CSV or JSON file first.');
        return;
      }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      statusDiv.innerHTML = '<span class="text-blue-600 font-semibold">Ingesting and validating dataset...</span>';
      try {
        const res = await fetch('/api/data/upload', { method: 'POST', body: formData });
        const data = await res.json();
        statusDiv.innerHTML = `<span class="text-emerald-600 font-semibold">✓ Successfully imported ${data.records_imported} records!</span>`;
        await loadOverview();
      } catch (err) {
        statusDiv.innerHTML = `<span class="text-rose-600 font-semibold">Upload failed: ${err.message}</span>`;
      }
    }

      if (!confirm('Restore reference 8,426 orders dataset?')) return;
      await fetch('/api/data/reset-sample', { method: 'POST' });
