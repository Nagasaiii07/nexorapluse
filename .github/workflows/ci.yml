name: NEXUS CI & Vercel Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Health Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Backend Integration & Unit Tests
      run: |
        PYTHONPATH=backend pytest backend/tests

    - name: Validate OpenAPI Schema Contract
      run: |
        python -c "import sys; sys.path.insert(0, 'backend'); from main import app; assert app.openapi()['info']['title'] == 'NEXUS Logistics Intelligence'"

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Next.js App
      run: |
        cd frontend
        npm run build

