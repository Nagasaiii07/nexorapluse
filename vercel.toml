# Vercel Production Configuration for NEXUS Logistics Intelligence
# Monorepo with Next.js Frontend and FastAPI Python Backend

version = 2

[[builds]]
src = "backend/main.py"
use = "@vercel/python"

[builds.config]
maxLambdaSize = "50mb"
runtime = "python3.12"

[[builds]]
src = "frontend/package.json"
use = "@vercel/next"

[[routes]]
src = "/api/(.*)"
dest = "backend/main.py"

[[routes]]
src = "/(.*)"
dest = "frontend/$1"
